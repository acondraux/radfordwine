<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="description" content="Browse the art of Radford Wine by category.">
  <link rel="stylesheet" href="css/style.css">

<body>

  <!-- NAV -->
  <nav class="site-nav">
    <ul class="nav-links">

    </ul>
  </nav>

  <div class="art-logo">

  <main class="art-page">

    <p class="section-title">The Art</p>

    <div class="category-grid">

        </div>
      </div>

      <div class="painting-card">
        <a href="#">

        <div class="painting-caption">

    <div class="flourish">
